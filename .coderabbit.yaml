# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: 시니어 프론트엔드 엔지니어 관점에서 한국어로 간결하게 리뷰한다. 지적할 때는 근거가 되는 컨벤션 문서를 함께 언급한다.
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    base_branches:
      - dev
      - main
  path_instructions:
    - path: src/**
      instructions: >-
        규칙의 출처는 AGENTS.md와 docs/conventions다. FSD 의존 방향·슬라이스 공개
        API·파일명 kebab-case·임의 값·import 위치는 ESLint가 이미 잡으므로, 기계로
        못 잡는 것을 본다 — 서버 데이터를 Zustand에 복사하지 않는지, use client가
        필요한 최하위에만 있는지, 서버에서 가능한 필터·정렬·페이지네이션을
        클라이언트에서 재수행하지 않는지, HEX 하드코딩 대신 시맨틱 토큰을 쓰고
        라이트·다크 양쪽 값이 정의됐는지, 터치 UX(최소 44×44, hover 의존 금지, 색
        단독 정보전달 금지)와 접근성 이름(아이콘만 있는 버튼 주의)을 지키는지,
        새 소스 파일 첫 줄에 한국어 역할 주석이 있는지(src/shared/ui 제외) 확인한다.
    - path: src/shared/ui/**
      instructions: >-
        shadcn CLI가 생성하고 소유하는 파일이다. CLI 재실행이 아닌 손수정이
        들어왔다면 사유를 확인하고, 접근성 속성(ARIA·포커스)을 제거하는 변경은 막는다.
    - path: src/views/**
      instructions: >-
        새 페이지 슬라이스에는 README.md가 함께 추가되어야 한다. 템플릿은
        src/views/README.md의 "페이지 README" 절을 따른다.
    - path: e2e/**
      instructions: >-
        테스트가 유저 플로우 단위인지, CSS 셀렉터 대신 role·label 기반 셀렉터를
        쓰는지 본다.
    - path: package.json
      instructions: >-
        overrides의 react-is 고정을 제거하는 변경은 막는다(Recharts v3가 깨진다).
        의존성을 추가·갱신했다면 AGENTS.md와 README.md의 스택 표 갱신 여부를 확인한다.
    - path: docs/**
      instructions: >-
        문서가 실제 코드·설정과 어긋나지 않는지, 존재하지 않는 파일·경로를
        참조하지 않는지 본다.
