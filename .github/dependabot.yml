# 의존성 갱신 PR을 주 1회 자동으로 연다.
#
# 커밋 prefix를 scope 없는 chore로 둔다. pr-label.yml의 제목 정규식은
# `유형(#이슈번호):` 형태만 인식하므로 Dependabot 기본값인 `chore(deps):`는
# 매칭되지 않고, 라벨이 안 붙으면 릴리스 노트가 "그 밖의 변경"으로 떨어진다.
#
# minor·patch는 한 PR로 묶는다. Next 16·React 19·Tailwind 4처럼 패치 주기가
# 빠른 스택이라 개별로 오면 3인 팀이 리뷰만 하다 끝난다. major는 묶지 않고
# 따로 와야 변경점을 제대로 본다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
