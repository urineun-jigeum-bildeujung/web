# PR 제목의 유형으로 라벨을 자동 부착한다.
# 라벨은 릴리스 노트(.github/release.yml)의 분류 기준이므로, 사람이 깜빡해도
# 분류가 깨지지 않게 한다. 제목 형식은 docs/conventions/git-convention.md를 따른다.
#
# pull_request가 아니라 pull_request_target을 쓴다. 공개 저장소에서 fork가 보낸
# PR의 GITHUB_TOKEN은 permissions 선언과 무관하게 읽기 전용이라, pull_request로는
# gh pr edit이 403으로 실패한다.
#
# 이 워크플로우는 PR 코드를 checkout하지 않고 제목만 읽으므로 pull_request_target을
# 써도 안전하다. **여기에 checkout이나 PR 코드 실행을 추가하지 마십시오.**
# base 브랜치 컨텍스트에서 쓰기 토큰을 들고 도는 자리다.
name: PR 라벨

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    name: 제목 유형으로 라벨 부착
    runs-on: ubuntu-latest
    steps:
      - name: 라벨 동기화
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES="feat fix refactor style test chore docs design"

          TYPE=$(printf '%s' "$TITLE" \
            | grep -oE '^(feat|fix|refactor|style|test|chore|docs|design)(\(#[1-9][0-9]*\))?: [^[:space:]].*' \
            | grep -oE '^[a-z]+' || true)

          CURRENT=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')

          # 유형을 못 찾았는데 이전에 붙은 유형 라벨이 남아 있으면, 릴리스 노트가
          # 지금 제목과 무관한 분류로 묶인다. 제목이 유효하지 않은 형식으로
          # 바뀐 경우이므로 관리 대상 라벨을 모두 뗀 뒤 끝낸다.
          if [ -z "$TYPE" ]; then
            echo "제목에서 유형을 찾지 못했습니다: $TITLE"
            echo "형식: 유형(#이슈번호): 내용"
            for t in $TYPES; do
              if printf '%s\n' "$CURRENT" | grep -qx "$t"; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$t"
                echo "제거: $t"
              fi
            done
            exit 0
          fi

          echo "감지된 유형: $TYPE"

          # 제목이 수정된 경우를 대비해 다른 유형 라벨을 먼저 뗀다.
          for t in $TYPES; do
            [ "$t" = "$TYPE" ] && continue
            if printf '%s\n' "$CURRENT" | grep -qx "$t"; then
              gh pr edit "$PR" --repo "$REPO" --remove-label "$t"
              echo "제거: $t"
            fi
          done

          if printf '%s\n' "$CURRENT" | grep -qx "$TYPE"; then
            echo "이미 부착됨: $TYPE"
          else
            gh pr edit "$PR" --repo "$REPO" --add-label "$TYPE"
            echo "부착: $TYPE"
          fi
