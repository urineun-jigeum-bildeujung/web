# PR 품질 게이트. 배포는 인프라팀 파이프라인이 담당하고, 이 워크플로우는 코드 품질만 본다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 검사만 하는 워크플로우다. checkout과 리포트 업로드에 필요한 읽기만 준다.
# 저장소 기본값에 기대지 않고 파일 안에 고정한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 검증 (typecheck·format·lint·test·build)
    runs-on: ubuntu-latest
    # 실측 40초대. 기본값(6시간)으로 두면 어딘가 멈췄을 때 아무도 모른 채
    # 러너만 물고 있는다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 빌드 캐시. 소스가 바뀌면 키가 어긋나므로 restore-keys로 직전 캐시를
      # 받아 증분 빌드한다. 룰셋이 브랜치 최신화를 강제해 rebase 후 재실행이
      # 잦은데, CI 대기가 곧 머지 대기다.
      - name: Next 빌드 캐시
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: 타입 검사
        run: npm run typecheck

      - name: 포맷 검사
        run: npm run format:check

      - name: 린트
        run: npm run lint

      - name: 단위 테스트
        run: npm run test

      - name: 빌드
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    # 실측 1~4분. 브라우저 설치가 멈췄던 #33 같은 상황을 몇 분 안에 끊는다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 브라우저 바이너리는 100MB가 넘고 매 실행 새로 받으면 그만큼 대기가 는다.
      # 키는 Playwright 버전을 따라야 하므로 lockfile 해시를 쓴다.
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 캐시 적중 여부로 분기하지 않는다. install은 이미 받아둔 바이너리를
      # 다시 내려받지 않으므로, 캐시가 맞으면 시스템 라이브러리만 처리하고
      # 끝난다. 캐시 이득은 그대로다.
      #
      # 예전에는 적중 시 `playwright install-deps`를 따로 돌렸는데, 그 명령이
      # sudo apt-get 프롬프트에서 stdin을 기다리며 멈췄다. 캐시가 처음 적중한
      # 실행에서 E2E가 1시간 넘게 끝나지 않았다 (#33).
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 테스트
        run: npm run test:e2e

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
