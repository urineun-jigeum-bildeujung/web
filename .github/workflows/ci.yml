# PR 품질 게이트. 배포는 인프라팀 파이프라인이 담당하고, 이 워크플로우는 코드 품질만 본다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 검사만 하는 워크플로우다. checkout과 리포트 업로드에 필요한 읽기만 준다.
# 저장소 기본값에 기대지 않고 파일 안에 고정한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 검증 (typecheck·format·lint·test·build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 빌드 캐시. 소스가 바뀌면 키가 어긋나므로 restore-keys로 직전 캐시를
      # 받아 증분 빌드한다. 룰셋이 브랜치 최신화를 강제해 rebase 후 재실행이
      # 잦은데, CI 대기가 곧 머지 대기다.
      - name: Next 빌드 캐시
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: 타입 검사
        run: npm run typecheck

      - name: 포맷 검사
        run: npm run format:check

      - name: 린트
        run: npm run lint

      - name: 단위 테스트
        run: npm run test

      - name: 빌드
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 브라우저 바이너리는 100MB가 넘고 매 실행 새로 받으면 그만큼 대기가 는다.
      # 키는 Playwright 버전을 따라야 하므로 lockfile 해시를 쓴다.
      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 캐시가 맞으면 바이너리는 이미 있고 시스템 라이브러리만 채우면 된다.
      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 의존성 설치
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E 테스트
        run: npm run test:e2e

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
