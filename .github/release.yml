# 릴리스 노트 자동 생성 규칙.
# GitHub Releases에서 "Generate release notes"를 누르면 머지된 PR을 아래 분류로 묶어준다.
# 분류 기준은 PR에 달린 라벨이다.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: ✨ 기능
      labels:
        - enhancement
        - feat
    - title: 🐛 버그 수정
      labels:
        - bug
        - fix
    - title: 🎨 디자인·스타일
      labels:
        - design
        - style
    - title: ♻️ 리팩터링
      labels:
        - refactor
    - title: 🧪 테스트
      labels:
        - test
    - title: 📝 문서
      labels:
        - documentation
        - docs
    - title: 🔧 설정·잡무
      labels:
        - chore
    - title: 그 밖의 변경
      labels:
        - "*"
